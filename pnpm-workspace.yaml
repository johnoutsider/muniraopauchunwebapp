# pnpm 11 native paketlarning build skriptlari uchun ochiq ruxsat so'raydi.
# Ruxsati yozilmagan paket qolsa, `pnpm install` ERR_PNPM_IGNORED_BUILDS bilan
# yiqiladi va Vercel deploy'i o'rnatish bosqichida uziladi.
#
# Eslatma: firebase-tools ataylab bu yerda yo'q — u lokal administrator vositasi,
# ilovaning bir qismi emas. `npx firebase ...` orqali chaqiriladi (scripts/README.md).
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
